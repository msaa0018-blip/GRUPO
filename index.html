  <script>
    (function() {
      'use strict';

      // ... (código anterior sin cambios hasta la función generarPDFParaPreview) ...

      // ---------- FUNCIÓN PARA GENERAR PDF CON NUEVO DISEÑO ----------
      function generarPDFParaPreview(datos) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'pt', 'a4');
        const pageWidth = doc.internal.pageSize.getWidth();
        const margin = 40;
        let y = margin;

        const nombreEmpresa = getNombreMembrete(datos.empresa);
        const leyendaPie = getLeyendaPie(datos.empresa);

        // ----- MEMBRETE (DERECHA) -----
        doc.setFontSize(18);
        doc.setTextColor(11, 26, 51);
        doc.setFont('helvetica', 'bold');
        doc.text(nombreEmpresa, pageWidth - margin - 10, y, { align: 'right' });
        y += 60; // Espacio especial después del membrete

        // ----- TÍTULO ORDEN DE COMPRA -----
        doc.setFontSize(16);
        doc.setTextColor(0, 0, 0);
        doc.setFont('helvetica', 'bold');
        doc.text('ORDEN DE COMPRA', margin, y);
        y += 10; // Espacio reducido a 5

        // Línea separadora
        doc.setDrawColor(200, 200, 200);
        doc.setLineWidth(0.5);
        doc.line(margin, y, pageWidth - margin, y);
        y += 5; // Espacio reducido a 5

        // ----- DATOS DE LA OC (SIN CÓDIGO) -----
        doc.setFontSize(9);
        doc.setTextColor(0, 0, 0);
        doc.setFont('helvetica', 'normal');

        const datosLista = [
          { label: 'Proveedor:', value: datos.proveedor },
          { label: 'RFC:', value: datos.rfc },
          { label: 'Fecha de Entrega:', value: new Date(datos.fechaentrega).toLocaleDateString() },
          { label: 'Dirección:', value: datos.direccion },
          { label: 'Dirección de entrega:', value: datos.direccionentrega },
          { label: 'Cuenta:', value: datos.cuenta || 'N/A' },
          { label: 'Uso CFDI:', value: datos.usocfdi },
          { label: 'CLABE:', value: datos.clabe || 'N/A' },
          { label: 'Moneda:', value: datos.moneda }
        ];

        datosLista.forEach((item) => {
          doc.setFont('helvetica', 'bold');
          doc.text(item.label, margin, y);
          doc.setFont('helvetica', 'normal');
          const labelWidth = doc.getTextWidth(item.label) + 8;
          const maxWidth = pageWidth - margin - labelWidth - 20;
          const textLines = doc.splitTextToSize(item.value, maxWidth);
          doc.text(textLines, margin + labelWidth, y);
          y += textLines.length * 5 + 2; // Espacio reducido a 5
        });

        y += 5; // Espacio reducido a 5

        // ----- TABLA DE PRODUCTOS -----
        const headers = ['#', 'Parte', 'Descripción', 'Cant.', 'UDM', 'Precio', 'Dto.%', 'Imp.%', 'Importe'];
        const rows = datos.productos.map((p, i) => [
          i + 1,
          p.parte || '',
          p.descripcion,
          p.cantidad,
          p.udm || 'PZA',
          formatoMoneda(p.precioUnitario, datos.moneda),
          p.descuento.toFixed(2) + '%',
          p.impuesto.toFixed(2) + '%',
          formatoMoneda(p.importe, datos.moneda)
        ]);

        doc.autoTable({
          head: [headers],
          body: rows,
          startY: y,
          margin: { left: margin, right: margin },
          styles: { fontSize: 8, cellPadding: 3, font: 'helvetica' },
          headStyles: { fillColor: [30, 40, 60], textColor: [255, 255, 255], fontSize: 8, font: 'helvetica',
            fontStyle: 'bold' },
          columnStyles: {
            0: { cellWidth: 20 },
            1: { cellWidth: 40 },
            2: { cellWidth: 'auto' },
            3: { cellWidth: 30 },
            4: { cellWidth: 25 },
            5: { cellWidth: 45 },
            6: { cellWidth: 40 },
            7: { cellWidth: 40 },
            8: { cellWidth: 45 }
          }
        });

        y = doc.lastAutoTable.finalY + 10; // Espacio reducido a 10

        // ----- TOTALES -----
        const subtotal = datos.montototal / (1 + (datos.productos[0]?.impuesto || 0) / 100);
        const iva = datos.montototal - subtotal;
        const totalX = pageWidth * 0.72;

        doc.setFontSize(10);
        doc.setFont('helvetica', 'normal');
        doc.setTextColor(0, 0, 0);

        doc.text('Subtotal:', totalX, y);
        doc.text(formatoMoneda(subtotal, datos.moneda), pageWidth - margin, y, { align: 'right' });
        y += 5; // Espacio reducido a 5

        const impuestoPorcentaje = datos.productos[0]?.impuesto || 0;
        doc.text('IVA (' + impuestoPorcentaje + '%):', totalX, y);
        doc.text(formatoMoneda(iva, datos.moneda), pageWidth - margin, y, { align: 'right' });
        y += 5; // Espacio reducido a 5

        doc.setFont('helvetica', 'bold');
        doc.setFontSize(12);
        doc.text('TOTAL:', totalX, y);
        doc.text(formatoMoneda(datos.montototal, datos.moneda), pageWidth - margin, y, { align: 'right' });
        y += 15; // Espacio antes de autorizaciones

        // ----- AUTORIZACIONES -----
        doc.setFontSize(11);
        doc.setTextColor(0, 0, 0);
        doc.setFont('helvetica', 'bold');
        doc.text('AUTORIZACIONES', margin, y);
        y += 5; // Espacio reducido a 5

        const solicitante = datos.responsable || 'No definido';
        const jefe = getJefeDepto(datos.empresa, datos.departamento);
        const director = getDirector();
        const colWidth = (pageWidth - 2 * margin) / 3;

        function dibujarAutorizacion(doc, x, y, nombre, titulo) {
          const lineWidth = colWidth - 20;

          doc.setFontSize(9);
          doc.setTextColor(100, 100, 100);
          doc.setFont('helvetica', 'normal');
          doc.text(titulo + ':', x + (lineWidth / 2), y, { align: 'center' });

          doc.setFontSize(10);
          doc.setTextColor(0, 0, 0);
          doc.setFont('helvetica', 'bold');
          doc.text(nombre + ' (Pendiente)', x + (lineWidth / 2), y + 10, { align: 'center' }); // Espacio reducido a 10

          // Línea de firma - espacio entre nombre y línea
          const lineY = y + 25; // Reducido de 45 a 25
          doc.setDrawColor(80, 80, 80);
          doc.setLineWidth(0.8);
          doc.line(x + 10, lineY, x + lineWidth - 10, lineY);

          doc.setFontSize(8);
          doc.setTextColor(150, 150, 150);
          doc.setFont('helvetica', 'normal');
          doc.text('Fecha: Pendiente', x + (lineWidth / 2), lineY + 10, { align: 'center' }); // Espacio reducido a 10
        }

        const x1 = margin;
        const x2 = margin + colWidth;
        const x3 = margin + colWidth * 2;

        dibujarAutorizacion(doc, x1, y, solicitante, 'Solicitante');
        dibujarAutorizacion(doc, x2, y, jefe, 'Jefe de Departamento');
        dibujarAutorizacion(doc, x3, y, director, 'Director General');

        // ----- PIE DE PÁGINA CON CÓDIGO -----
        const pieY = doc.internal.pageSize.height - 55;
        doc.setDrawColor(200, 200, 200);
        doc.setLineWidth(0.5);
        doc.line(margin, pieY, pageWidth - margin, pieY);

        // Leyenda (centrada)
        doc.setFontSize(9);
        doc.setTextColor(11, 26, 51);
        doc.setFont('helvetica', 'bold');
        doc.text(leyendaPie, pageWidth / 2, pieY + 10, { align: 'center' }); // Espacio reducido a 10

        // Código de la OC (debajo de la leyenda, centrado)
        const codigoFinal = generarCodigoOC(
          datos.empresa,
          datos.departamento,
          datos.proveedor,
          datos.proyectonombre,
          datos.cliente,
          datos.elaborador,
          consecutivoOC
        );
        doc.setFontSize(7);
        doc.setTextColor(80, 80, 80);
        doc.setFont('helvetica', 'normal');
        doc.text('Código: ' + codigoFinal, pageWidth / 2, pieY + 20, { align: 'center' }); // Espacio reducido a 20

        // Número de página (derecha)
        doc.setFontSize(8);
        doc.setTextColor(100, 100, 100);
        doc.setFont('helvetica', 'normal');
        doc.text('Página 1 de 1', pageWidth - margin, pieY + 10, { align: 'right' });

        return doc;
      }

      // ---------- FUNCIÓN PARA GENERAR PDF FIRMADO ----------
      function generarPDFFirmado(oc) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'pt', 'a4');
        const pageWidth = doc.internal.pageSize.getWidth();
        const margin = 40;
        let y = margin;

        const proyecto = proyectos.find(p => p.nombre === oc.proyecto);
        const nombreEmpresa = proyecto ? getNombreMembrete(proyecto.empresa) : 'GRUPO INDUSTRIAL EXTINGUE';
        const leyendaPie = proyecto ? getLeyendaPie(proyecto.empresa) : 'GRACIAS POR CONFIARNOS TU SEGURIDAD';

        // ----- MEMBRETE (DERECHA) -----
        doc.setFontSize(18);
        doc.setTextColor(11, 26, 51);
        doc.setFont('helvetica', 'bold');
        doc.text(nombreEmpresa, pageWidth - margin - 10, y, { align: 'right' });
        y += 60; // Espacio especial después del membrete

        // ----- TÍTULO ORDEN DE COMPRA -----
        doc.setFontSize(16);
        doc.setTextColor(0, 0, 0);
        doc.setFont('helvetica', 'bold');
        doc.text('ORDEN DE COMPRA', margin, y);
        y += 10; // Espacio reducido a 10

        // Línea separadora
        doc.setDrawColor(200, 200, 200);
        doc.setLineWidth(0.5);
        doc.line(margin, y, pageWidth - margin, y);
        y += 5; // Espacio reducido a 5

        // ----- DATOS DE LA OC (SIN CÓDIGO) -----
        doc.setFontSize(9);
        doc.setTextColor(0, 0, 0);
        doc.setFont('helvetica', 'normal');

        const datosLista = [
          { label: 'Proveedor:', value: oc.proveedor },
          { label: 'RFC:', value: oc.rfc },
          { label: 'Fecha de Entrega:', value: new Date(oc.fechaentrega).toLocaleDateString() },
          { label: 'Dirección:', value: oc.direccion },
          { label: 'Dirección de entrega:', value: oc.direccionentrega || 'No especificada' },
          { label: 'Cuenta:', value: oc.cuenta || 'N/A' },
          { label: 'Uso CFDI:', value: oc.usocfdi },
          { label: 'CLABE:', value: oc.clabe || 'N/A' },
          { label: 'Moneda:', value: oc.moneda }
        ];

        datosLista.forEach((item) => {
          doc.setFont('helvetica', 'bold');
          doc.text(item.label, margin, y);
          doc.setFont('helvetica', 'normal');
          const labelWidth = doc.getTextWidth(item.label) + 8;
          const maxWidth = pageWidth - margin - labelWidth - 20;
          const textLines = doc.splitTextToSize(item.value, maxWidth);
          doc.text(textLines, margin + labelWidth, y);
          y += textLines.length * 5 + 2; // Espacio reducido a 5
        });

        y += 5; // Espacio reducido a 5

        // ----- TABLA DE PRODUCTOS -----
        const headers = ['#', 'Parte', 'Descripción', 'Cant.', 'UDM', 'Precio', 'Dto.%', 'Imp.%', 'Importe'];
        const rows = oc.productos.map((p, i) => [
          i + 1,
          p.parte || '',
          p.descripcion,
          p.cantidad,
          p.udm || 'PZA',
          formatoMoneda(p.precioUnitario, oc.moneda),
          p.descuento.toFixed(2) + '%',
          p.impuesto.toFixed(2) + '%',
          formatoMoneda(p.importe, oc.moneda)
        ]);

        doc.autoTable({
          head: [headers],
          body: rows,
          startY: y,
          margin: { left: margin, right: margin },
          styles: { fontSize: 8, cellPadding: 3, font: 'helvetica' },
          headStyles: { fillColor: [30, 40, 60], textColor: [255, 255, 255], fontSize: 8, font: 'helvetica',
            fontStyle: 'bold' },
          columnStyles: {
            0: { cellWidth: 20 },
            1: { cellWidth: 40 },
            2: { cellWidth: 'auto' },
            3: { cellWidth: 30 },
            4: { cellWidth: 25 },
            5: { cellWidth: 45 },
            6: { cellWidth: 40 },
            7: { cellWidth: 40 },
            8: { cellWidth: 45 }
          }
        });

        y = doc.lastAutoTable.finalY + 10; // Espacio reducido a 10

        // ----- TOTALES -----
        const subtotal = oc.montototal / (1 + (oc.productos[0]?.impuesto || 0) / 100);
        const iva = oc.montototal - subtotal;
        const totalX = pageWidth * 0.72;

        doc.setFontSize(10);
        doc.setFont('helvetica', 'normal');
        doc.setTextColor(0, 0, 0);

        doc.text('Subtotal:', totalX, y);
        doc.text(formatoMoneda(subtotal, oc.moneda), pageWidth - margin, y, { align: 'right' });
        y += 5; // Espacio reducido a 5

        const impuestoPorcentaje = oc.productos[0]?.impuesto || 0;
        doc.text('IVA (' + impuestoPorcentaje + '%):', totalX, y);
        doc.text(formatoMoneda(iva, oc.moneda), pageWidth - margin, y, { align: 'right' });
        y += 5; // Espacio reducido a 5

        doc.setFont('helvetica', 'bold');
        doc.setFontSize(12);
        doc.text('TOTAL:', totalX, y);
        doc.text(formatoMoneda(oc.montototal, oc.moneda), pageWidth - margin, y, { align: 'right' });
        y += 15; // Espacio antes de autorizaciones

        // ----- AUTORIZACIONES -----
        doc.setFontSize(11);
        doc.setTextColor(0, 0, 0);
        doc.setFont('helvetica', 'bold');
        doc.text('AUTORIZACIONES', margin, y);
        y += 5; // Espacio reducido a 5

        const solicitanteNombre = oc.responsable || 'No definido';
        const jefeNombre = proyecto ? getJefeDepto(proyecto.empresa, proyecto.departamento) : 'No definido';
        const directorNombre = getDirector();
        const colWidth = (pageWidth - 2 * margin) / 3;

        function dibujarAutorizacionFirmada(doc, x, y, nombre, titulo, fecha) {
          const lineWidth = colWidth - 20;

          doc.setFontSize(9);
          doc.setTextColor(100, 100, 100);
          doc.setFont('helvetica', 'normal');
          doc.text(titulo + ':', x + (lineWidth / 2), y, { align: 'center' });

          doc.setFontSize(10);
          doc.setTextColor(0, 0, 0);
          doc.setFont('helvetica', 'bold');
          const estado = fecha && fecha !== 'Pendiente' ? '' : ' (Pendiente)';
          doc.text(nombre + estado, x + (lineWidth / 2), y + 10, { align: 'center' }); // Espacio reducido a 10

          // Línea de firma - espacio entre nombre y línea
          const lineY = y + 25; // Reducido de 45 a 25
          doc.setDrawColor(80, 80, 80);
          doc.setLineWidth(0.8);
          doc.line(x + 10, lineY, x + lineWidth - 10, lineY);

          doc.setFontSize(8);
          doc.setTextColor(150, 150, 150);
          doc.setFont('helvetica', 'normal');
          doc.text('Fecha: ' + (fecha || 'Pendiente'), x + (lineWidth / 2), lineY + 10, { align: 'center' }); // Espacio reducido a 10

        const x2 = margin + colWidth;
        const x3 = margin + colWidth * 2;

          'Pendiente';

        dibujarAutorizacionFirmada(doc, x1, y, solicitanteNombre, 'Solicitante', fechaSolicitante);
        dibujarAutorizacionFirmada(doc, x2, y, jefeNombre, 'Jefe de Departamento', fechaJefe);
        dibujarAutorizacionFirmada(doc, x3, y, directorNombre, 'Director General', fechaDirector);

        // ----- PIE DE PÁGINA CON CÓDIGO -----
        const pieY = doc.internal.pageSize.height - 55;
        doc.setDrawColor(200, 200, 200);
        doc.setLineWidth(0.5);
        doc.line(margin, pieY, pageWidth - margin, pieY);

        doc.setFontSize(9);
        doc.setTextColor(11, 26, 51);
        doc.setFont('helvetica', 'bold');
        doc.text(leyendaPie, pageWidth / 2, pieY + 10, { align: 'center' }); // Espacio reducido a 10

        doc.setFontSize(7);
        doc.setTextColor(80, 80, 80);
        doc.setFont('helvetica', 'normal');
        doc.text('Código: ' + oc.codigo, pageWidth / 2, pieY + 20, { align: 'center' }); // Espacio reducido a 20

        doc.setFontSize(8);
        doc.setTextColor(100, 100, 100);
        doc.setFont('helvetica', 'normal');
        doc.text('Página 1 de 1', pageWidth - margin, pieY + 10, { align: 'right' });

        doc.save(`OC_${oc.codigo}.pdf`);
      }

      // ... (resto del código sin cambios) ...

    })();
  </script>
